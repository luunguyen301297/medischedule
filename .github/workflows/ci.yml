name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Migration và bí mật
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Kiểm thay đổi
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Push đầu tiên của nhánh hoặc force-push: commit gốc không còn
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          sh scripts/check-changes.sh --base "$BASE"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build # gồm tsc --noEmit

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qa_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d qa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    # Giá trị chỉ dùng cho DB tạm của CI, không phải bí mật thật
    env:
      DB_URL: jdbc:postgresql://localhost:5432/qa_ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only
      JWT_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Extension như infra/postgres/init.sql
        run: psql "postgresql://ci:ci-only@localhost:5432/qa_ci" -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - run: ./mvnw -B verify
        working-directory: backend
